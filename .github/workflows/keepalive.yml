# Supabase 무료 프로젝트는 일주일 동안 접속이 없으면 자동으로 일시정지됩니다.
# 매일 한 번 데이터베이스에 가볍게 접속해서 일시정지되지 않게 합니다.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *'   # 매일 UTC 03:17 (한국 시간 낮 12:17)
  workflow_dispatch:        # Actions 탭에서 직접 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (아이템 1개 조회)
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://xelboshexpgsvhfgeghd.supabase.co/rest/v1/items?select=id&limit=1" \
            -H "apikey: sb_publishable_StC2lo5fs-7I-68HgQQVUQ_pKMDj8fi")
          echo "Supabase 응답: $code"
          test "$code" = "200"
